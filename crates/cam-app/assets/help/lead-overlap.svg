<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-label="Closure overlap on a closed contour"><title>Closure overlap on a closed contour</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#60c9ef"/></marker></defs><rect width="420" height="190" rx="8" fill="#1f242b"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:12px;fill:#dce6ed} .wall{stroke:#dce6ed;stroke-width:2;fill:none}.lead{stroke:#60c9ef;stroke-width:3;fill:none;marker-end:url(#a)} .dim{stroke:#efba59;stroke-width:2;fill:none}.small{font-size:11px}</style><path class="wall" d="M90 55H340V140H90Z"/><path d="M90 55H175" stroke="#efba59" stroke-width="5" fill="none" marker-end="url(#a)"/><circle cx="90" cy="55" r="5" fill="#60c9ef"/><text x="30" y="35">Start</text><text x="185" y="48">Overlap: cut past start</text><text x="105" y="105">Closed contour · top view</text><text x="25" y="174" class="small">Extra cutting before the lead-out reduces the seam.</text></svg>
