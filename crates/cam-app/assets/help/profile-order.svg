<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-label="Comparison of profile cut order"><title>Comparison of profile cut order</title><rect width="420" height="190" rx="8" fill="#1f242b"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#60c9ef"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:12px;fill:#dce6ed}.s{font-size:11px}.cut{stroke:#60c9ef;stroke-width:3;fill:none}.ref{stroke:#dce6ed;stroke-width:2;fill:none}.dim{stroke:#efba59;stroke-width:2;fill:none}.dash{stroke:#dce6ed;stroke-width:2;stroke-dasharray:5 4;fill:none}</style><text x="15" y="24">BY CONTOUR</text><text x="150" y="24">BY DEPTH</text><text x="285" y="24">BY RADIAL PASS</text><text x="15" y="55">A: depth 1, 2</text><text x="15" y="75">B: depth 1, 2</text><text x="150" y="55">Depth 1: A, B</text><text x="150" y="75">Depth 2: A, B</text><text x="285" y="55">Stage 1: A, B</text><text x="285" y="75">Stage 2: A, B</text><path class="dim" d="M15 94H405"/><text x="15" y="122">Each example holds the other dimensions fixed.</text><text x="15" y="147">Outside stock clearing, if enabled, runs first.</text><text x="15" y="170" class="s">A and B are contours; stages are radial passes.</text></svg>
