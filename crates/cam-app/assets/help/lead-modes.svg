<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-label="Lead mode comparison, top view"><title>Lead mode comparison, top view</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#60c9ef"/></marker></defs><rect width="420" height="190" rx="8" fill="#1f242b"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;font-size:12px;fill:#dce6ed} .wall{stroke:#dce6ed;stroke-width:2;fill:none}.lead{stroke:#60c9ef;stroke-width:3;fill:none;marker-end:url(#a)} .dim{stroke:#efba59;stroke-width:2;fill:none}.small{font-size:11px}</style><text x="15" y="22">NONE</text><text x="150" y="22">LINEAR</text><text x="290" y="22">ARC</text><path class="wall" d="M15 115H125 M150 115H260 M290 115H405"/><path class="lead" d="M70 115h40 M150 115h65 M290 65 Q290 115 340 115 H380"/><circle cx="70" cy="115" r="4" fill="#efba59"/><text x="15" y="150" class="small">Start on contour</text><text x="150" y="150" class="small">Tangent line</text><text x="290" y="150" class="small">Tangent arc</text><text x="15" y="177" class="small">Entry shown; exit follows the reverse departure.</text></svg>
