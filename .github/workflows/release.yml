name: Release

on:
  push:
    tags: [ "v*" ]
  release:
    types: [published]
  # Build all three platforms without tagging, to prove the pipeline before a real
  # release. No Release is published on this path -- see the `release` job's `if`.
  workflow_dispatch:

permissions:
  contents: read

# Serialize tag-push and release-published runs for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Validate the release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag against the workspace version
        run: .github/scripts/version.sh
      - name: Test runtime packaging scripts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  linux:
    needs: version
    name: linux x86_64 (AppImage)
    # 22.04 deliberately, NOT ubuntu-latest: a dynamically linked binary's glibc floor
    # is whatever the builder has, and 24.04 produced a GLIBC_2.39 requirement that
    # will not start on Ubuntu 22.04 (2.35) or Debian 12 (2.36) -- most shop machines.
    # 22.04 drops the floor to 2.35, which is also where OpenCADStudio's own shipping
    # AppImage measures, so this matches a known-good reference rather than a guess.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Deliberately NO build cache in the release path (ci.yml keeps one, where speed
      # matters and the output is discarded). A shipped binary should be a function of
      # the commit and nothing else. This is not hypothetical: rust-cache keys on job
      # name + runner.os + host triple, none of which separate 22.04 from 24.04, and a
      # restored 24.04 target tree failed here with "can't find crate for iced".
      - name: System libraries (X11/Wayland/GL/font)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libx11-dev libxkbcommon-dev libwayland-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev
      - name: Version
        id: ver
        run: .github/scripts/version.sh
      - uses: ./.github/actions/setup-occt
      - name: Test native STEP/IGES imports
        run: |
          cargo test --locked --release -p cam-kernel --features occt
          # Tigerente.step is a local, untracked fixture; the authored corpus ships in git.
          cargo test --locked --release -p cam-app --features occt --test native_step --test native_iges \
            -- --include-ignored --skip tigerente \
            --skip silhouette_projection_is_independent_of_display_quality_on_curved_step_models
          cargo build --locked --release -p cam-kernel --features occt --example occt_smoke
      # `--features gui` is the whole point: cam-app's `default = []`, so without it
      # the packaged binary is the headless stub that prints "run cargo run" and exits.
      - name: Build the desktop app
        run: cargo build --locked --release -p cam-app --features gui,occt --bin opencamstudio
      - name: Build the AppImage
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.v }}
          APP=AppDir
          mkdir -p $APP/usr/bin \
                   $APP/usr/share/applications \
                   $APP/usr/share/icons/hicolor/256x256/apps
          cp target/release/opencamstudio $APP/usr/bin/
          python .github/scripts/package-occt.py stage "$APP"
          cp crates/cam-app/assets/opencamstudio-256.png \
             $APP/usr/share/icons/hicolor/256x256/apps/opencamstudio.png
          cat > $APP/usr/share/applications/opencamstudio.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Open CAM Studio
          Comment=CAM application for CNC toolpath generation
          Exec=opencamstudio %f
          Icon=opencamstudio
          Terminal=false
          Categories=Graphics;Engineering;Development;
          MimeType=application/x-ocam;image/vnd.dxf;image/vnd.dwg;
          Keywords=CAM;CNC;G-code;milling;toolpath;DXF;DWG;
          StartupWMClass=opencamstudio
          DESKTOP
          # appimagetool wants the desktop file and icon at the AppDir root too.
          cp $APP/usr/share/applications/opencamstudio.desktop $APP/
          cp crates/cam-app/assets/opencamstudio-256.png $APP/opencamstudio.png
          cp crates/cam-app/assets/opencamstudio-256.png $APP/.DirIcon
          cat > $APP/AppRun <<'APPRUN'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/opencamstudio" "$@"
          APPRUN
          chmod +x $APP/AppRun
          # OCCT's shared libraries are inside usr/lib; libc/libstdc++ come from the OS.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # --appimage-extract-and-run because CI runners have no FUSE.
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            $APP "OpenCAMStudio-$V-linux-x86_64.AppImage"
      # A regression guard, not a formality. The glibc floor is a property of the
      # BUILDER, so changing `runs-on` silently changes who can run the result --
      # ubuntu-latest produced GLIBC_2.39, which fails before main on Debian 12.
      # Nothing in the build output says so; it has to be measured.
      - name: Verify the AppImage
        run: |
          set -euo pipefail
          ./OpenCAMStudio-*.AppImage --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/opencamstudio
          FLOOR=$(objdump -T "$BIN" squashfs-root/usr/lib/*.so* | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                  | sort -uV | tail -1 | cut -d_ -f2)
          echo "glibc floor: $FLOOR"
          [ "$(printf '%s\n2.35\n' "$FLOOR" | sort -V | tail -1)" = "2.35" ] \
            || { echo "::error::glibc floor $FLOOR exceeds 2.35; Debian 12 cannot run this"; exit 1; }
          # The packaged binary must be the GUI app, not the headless stub that
          # cam-app builds without --features gui.
          ! strings -a "$BIN" | grep 'headless build' >/dev/null \
            || { echo "::error::packaged the headless stub, not the desktop app"; exit 1; }
          test -f squashfs-root/.DirIcon
          test -f squashfs-root/opencamstudio.desktop
          python .github/scripts/package-occt.py verify squashfs-root \
            --smoke target/release/examples/occt_smoke
          rm -rf squashfs-root
      - name: OCCT corresponding source
        run: python .github/scripts/package-occt.py source OpenCAMStudio-OCCT-7.9.3-source.tar.gz
      - name: Checksum
        run: .github/scripts/sha256.sh OpenCAMStudio-*.AppImage OpenCAMStudio-OCCT-*-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            OpenCAMStudio-*.AppImage*
            OpenCAMStudio-OCCT-*-source.tar.gz*
          if-no-files-found: error

  macos:
    needs: version
    name: macos arm64 (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Version
        id: ver
        run: .github/scripts/version.sh
      - uses: ./.github/actions/setup-occt
      - name: Test native STEP/IGES imports
        run: |
          cargo test --locked --release -p cam-kernel --features occt --target aarch64-apple-darwin
          # Tigerente.step is a local, untracked fixture; the authored corpus ships in git.
          cargo test --locked --release -p cam-app --features occt --test native_step --test native_iges \
            --target aarch64-apple-darwin -- --include-ignored --skip tigerente \
            --skip silhouette_projection_is_independent_of_display_quality_on_curved_step_models
          cargo build --locked --release -p cam-kernel --features occt --example occt_smoke --target aarch64-apple-darwin
      - name: Build the desktop app
        run: >
          cargo build --locked --release -p cam-app --features gui,occt --bin opencamstudio
          --target aarch64-apple-darwin
      - name: Build the .app bundle and .dmg
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.v }}
          APP="Open CAM Studio.app"
          BUNDLE_VERSION=${V#v}
          BUNDLE_VERSION=${BUNDLE_VERSION%-dev}
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/aarch64-apple-darwin/release/opencamstudio "$APP/Contents/MacOS/"
          python .github/scripts/package-occt.py stage "$APP"
          # .icns from the committed 1024 PNG. sips and iconutil are part of macOS, so
          # this needs no rasteriser and no third-party tool.
          ICONSET=opencamstudio.iconset
          mkdir -p $ICONSET
          SRC=crates/cam-app/assets/opencamstudio-1024.png
          for s in 16 32 128 256 512; do
            sips -z $s $s     "$SRC" --out "$ICONSET/icon_${s}x${s}.png"    >/dev/null
            sips -z $((s*2)) $((s*2)) "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns $ICONSET -o "$APP/Contents/Resources/opencamstudio.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>Open CAM Studio</string>
            <key>CFBundleDisplayName</key>       <string>Open CAM Studio</string>
            <key>CFBundleIdentifier</key>        <string>io.github.pr0m1th3as.OpenCAMStudio</string>
            <key>CFBundleVersion</key>           <string>${BUNDLE_VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${BUNDLE_VERSION}</string>
            <key>CFBundleExecutable</key>        <string>opencamstudio</string>
            <key>CFBundleIconFile</key>          <string>opencamstudio</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>LSMinimumSystemVersion</key>    <string>11.0</string>
            <key>NSHighResolutionCapable</key>   <true/>
          </dict>
          </plist>
          PLIST
          python .github/scripts/package-occt.py verify "$APP" \
            --smoke target/aarch64-apple-darwin/release/examples/occt_smoke
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Open CAM Studio" -srcfolder dmg -ov -format UDZO \
            "OpenCAMStudio-$V-macos-arm64.dmg"
      # Neither of us has a Mac, so this is the only verification the .dmg gets
      # before a user opens it. It proves everything except that a window appears:
      # the bundle is well-formed, the plist parses, the architecture is right, the
      # icon is a real icns, the image mounts, and the binary is the GUI build. The
      # packaging verification also starts it with --help after hiding the OCCT SDK.
      - name: Verify the bundle and the disk image
        run: |
          set -euo pipefail
          APP="Open CAM Studio.app"
          plutil -lint "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/opencamstudio" | grep -q 'arm64' \
            || { echo "::error::binary is not arm64"; exit 1; }
          ! strings -a "$APP/Contents/MacOS/opencamstudio" | grep 'headless build' >/dev/null \
            || { echo "::error::packaged the headless stub, not the desktop app"; exit 1; }
          file "$APP/Contents/Resources/opencamstudio.icns" | grep -qi 'icon' \
            || { echo "::error::icns is not a Mac OS X icon file"; exit 1; }
          # Mount it as a user would, confirm the app is inside, then detach.
          MNT=$(hdiutil attach OpenCAMStudio-*.dmg -nobrowse -readonly \
                | tail -1 | awk '{ $1=""; $2=""; sub(/^  */,""); print }')
          echo "mounted at: $MNT"
          test -x "$MNT/Open CAM Studio.app/Contents/MacOS/opencamstudio"
          test -L "$MNT/Applications"
          hdiutil detach "$MNT" >/dev/null
      - name: Checksum
        run: .github/scripts/sha256.sh OpenCAMStudio-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OpenCAMStudio-*.dmg*
          if-no-files-found: error

  windows:
    needs: version
    name: windows x86_64 (msi + portable zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Version
        id: ver
        shell: bash
        run: .github/scripts/version.sh
      - uses: ./.github/actions/setup-occt
      - name: Test native STEP/IGES imports
        shell: bash
        run: |
          cargo test --locked --release -p cam-kernel --features occt
          # Tigerente.step is a local, untracked fixture; the authored corpus ships in git.
          cargo test --locked --release -p cam-app --features occt --test native_step --test native_iges \
            -- --include-ignored --skip tigerente \
            --skip silhouette_projection_is_independent_of_display_quality_on_curved_step_models
          cargo build --locked --release -p cam-kernel --features occt --example occt_smoke
      - name: Build the desktop app
        run: cargo build --locked --release -p cam-app --features gui,occt --bin opencamstudio
      # The portable application now needs OCCT DLLs beside the executable.
      - name: Stage portable app and installer dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/occt-windows
          cp target/release/opencamstudio.exe target/occt-windows/
          python .github/scripts/package-occt.py stage target/occt-windows
          python .github/scripts/package-occt.py verify target/occt-windows \
            --smoke target/release/examples/occt_smoke.exe
          python .github/scripts/package-occt.py wix target/occt-windows
      - name: Portable ZIP
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          Compress-Archive -Path target/occt-windows/* -DestinationPath "OpenCAMStudio-$env:RELEASE_VERSION-windows-x86_64-portable.zip"
          Expand-Archive -Path "OpenCAMStudio-$env:RELEASE_VERSION-windows-x86_64-portable.zip" -DestinationPath target/portable-check
          python .github/scripts/package-occt.py verify target/portable-check --smoke target/release/examples/occt_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
      - name: Build the MSI
        shell: bash
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.v }}
          # NOT `cargo wix init` -- that regenerates wix/main.wxs, and with it a fresh
          # random UpgradeCode on every single build. Windows uses the UpgradeCode to
          # recognise that a new version supersedes the installed one, so a new GUID
          # each release means every version installs ALONGSIDE the last instead of
          # upgrading it. The wxs is committed, reviewed, and its UpgradeCode is fixed
          # for the life of the product.
          test -f crates/cam-app/wix/main.wxs
          cargo wix -p cam-app --no-build --nocapture \
            --include crates/cam-app/wix/main.wxs --include target/occt-runtime.wxs \
            --output "OpenCAMStudio-$V-windows-x86_64-installer.msi"
      - name: Verify the artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in OpenCAMStudio-*portable.zip OpenCAMStudio-*.msi; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
          done
          # An MSI is an OLE compound file: it must begin D0 CF 11 E0. A zero-byte or
          # half-written installer would otherwise sail through as a valid artifact.
          head -c 8 OpenCAMStudio-*.msi | od -An -tx1 | tr -d ' \n' | grep -qi '^d0cf11e0' \
            || { echo "::error::MSI is not an OLE compound file"; exit 1; }
          ! strings -a target/portable-check/opencamstudio.exe | grep 'headless build' >/dev/null \
            || { echo "::error::packaged the headless stub, not the desktop app"; exit 1; }
      - name: Verify installed MSI runtime
        shell: pwsh
        run: |
          $msi = (Get-ChildItem OpenCAMStudio-*.msi).FullName
          $result = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($result.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($result.ExitCode)" }
          try {
            python .github/scripts/package-occt.py verify "$env:ProgramFiles/Open CAM Studio/bin" --smoke target/release/examples/occt_smoke.exe
            if ($LASTEXITCODE -ne 0) { throw 'Installed STEP/IGES runtime failed' }
          } finally {
            $result = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            if ($result.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($result.ExitCode)" }
          }
      - name: Checksums
        shell: bash
        run: .github/scripts/sha256.sh OpenCAMStudio-*.msi OpenCAMStudio-*portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            OpenCAMStudio-*.msi*
            OpenCAMStudio-*portable.zip*
          if-no-files-found: error

  release:
    name: publish the GitHub Release
    needs: [linux, macos, windows]
    # Tags only. A workflow_dispatch run is a rehearsal and publishes nothing.
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Uploading to the Release itself, not just as workflow artifacts -- those expire
      # in 90 days and cannot be fetched without a GitHub login, so they are useless as
      # a download for anyone but us. `gh` is preinstalled, which keeps a third-party
      # action out of the release path.
      - name: Publish the Release and attach the platform builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l artifacts/
          # Validate the downloaded assets before attaching them to the release.
          (cd artifacts && sha256sum --check --strict *.sha256)
          # Publishing through the GitHub UI creates the release before this job;
          # reruns must also be able to replace assets after a partial upload.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          # A written release note if one exists for this tag, GitHub's generated
          # one otherwise. `--generate-notes` alone would list every commit since the
          # previous tag -- and with no previous tag, that is the entire history:
          # ~190 commits dumped as the first thing anyone reads.
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "using $NOTES"
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Open CAM Studio ${GITHUB_REF_NAME}" \
              --notes-file "$NOTES" \
              artifacts/*
          else
            echo "::warning::no $NOTES; falling back to generated notes"
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Open CAM Studio ${GITHUB_REF_NAME}" \
              --generate-notes \
              artifacts/*
          fi

# NOTE: none of these are code-signed. macOS will refuse the .dmg on first open until
# the user right-clicks Open (or clears the quarantine attribute), and Windows
# SmartScreen will warn on the MSI. Signing needs a paid Apple Developer ID and an
# Authenticode certificate; documented rather than pretended away.
